<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тауарларды басқару - Онлайн Дүкен</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-icon">🛒</div>
      <div>
        <h1>Дүкен тауарлары</h1>
        <p class="subtitle">Тауарларды қосу, өңдеу және есепке алу жүйесі</p>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Form Card -->
      <section class="card">
        <h2>Жаңа тауар қосу</h2>
        <form id="product-form" novalidate>
          
          <div class="form-group">
            <label for="product-name">Тауар атауы</label>
            <input 
              type="text" 
              id="product-name" 
              placeholder="Мысалы: Алма" 
              autocomplete="off"
            >
            <span class="error-msg" id="name-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-price">Бағасы (₸)</label>
              <input 
                type="number" 
                id="product-price" 
                placeholder="0" 
                min="1"
              >
              <span class="error-msg" id="price-error"></span>
            </div>

            <div class="form-group">
              <label for="product-quantity">Саны</label>
              <input 
                type="number" 
                id="product-quantity" 
                placeholder="1" 
                min="1" 
                value="1"
              >
              <span class="error-msg" id="quantity-error"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">
            <span>+</span> Тауарды қосу
          </button>
        </form>
      </section>

      <!-- Table Card -->
      <section class="card">
        <div class="card-header">
          <h2>Тауарлар тізімі</h2>
          <span class="badge" id="total-count">0</span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Атауы</th>
                <th>Бағасы</th>
                <th>Саны</th>
                <th>Суммасы</th>
                <th class="text-right">Әрекет</th>
              </tr>
            </thead>
            <tbody id="product-list">
              <!-- Тауарлар осы жерге JS арқылы шығады -->
            </tbody>
          </table>

          <!-- Empty State -->
          <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-icon">📦</div>
            <p>Тізім бос. Жаңа тауар қосыңыз!</p>
          </div>
        </div>

        <!-- Total Summary Bar -->
        <div class="total-bar">
          <span class="total-label">Жалпы сумма:</span>
          <span class="total-amount" id="total-price">0 ₸</span>
        </div>
      </section>

    </main>
  </div>

  <!-- Подключение JS скрипта -->
  <script src="app.js"></script>
</body>
</html>
