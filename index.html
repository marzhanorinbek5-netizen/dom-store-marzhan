<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Store - Lab 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Тауарларды басқару дүкені (Store)</h1>

    <form id="product-form" novalidate>
      <div class="form-group">
        <label for="name">Тауар атауы:</label>
        <input type="text" id="name" placeholder="Атауын енгізіңіз">
        <span class="error" id="name-error"></span>
      </div>

      <div class="form-group">
        <label for="price">Бағасы (₸):</label>
        <input type="number" id="price" placeholder="Мысалы: 500">
        <span class="error" id="price-error"></span>
      </div>

      <div class="form-group">
        <label for="qty">Саны:</label>
        <input type="number" id="qty" placeholder="Мысалы: 2">
        <span class="error" id="qty-error"></span>
      </div>

      <button type="submit">Қосу</button>
    </form>

    <h2>Тауарлар тізімі</h2>
    <table>
      <thead>
        <tr>
          <th>Атауы</th>
          <th>Бағасы</th>
          <th>Саны</th>
          <th>Жиынтығы</th>
          <th>Әрекеттер</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>

    <div class="total-container">
      <h3>Жалпы құны: <span id="total-price">0</span> ₸</h3>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
